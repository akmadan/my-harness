                        timeout: <+(<+serviceVariableOverrides.TestSuiteVerificationTimeout>!='' && <+serviceVariableOverrides.TestSuiteVerificationTimeout>!=null && <+serviceVariableOverrides.TestSuiteVerificationTimeout>!='null')?<+serviceVariableOverrides.TestSuiteVerificationTimeout>:'30m'>
          - stepGroup:
