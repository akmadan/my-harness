                          failureStrategies:
                            - onFailure:
                                errors:
                                  - DelegateRestart
                                  - DelegateProvisioning
                                action:
                                  type: Retry
                                  spec:
                                    retryCount: 3
                                    retryIntervals:
                                      - 1m
                                    onRetryFailure:
                                      action:
                                        type: StageRollback
                            - onFailure:
                                errors:
                                  - AllErrors
                                action:
                                  type: StageRollback
                    strategy:
                      matrix:
