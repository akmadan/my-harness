                                    value: <+pipeline.stages.<+stage.identifier>.spec.execution.steps.k8s_deployment_phase.steps.canary_phase_group<+strategy.node.canary_phase_group.identifierPostFix>.steps.canary_deploy_step.output.canaryWorkload>
                              when:
                                condition: "true"
                                stageStatus: Success
