                        export failedStepGroup="DDS-Schema-Check"
                      elif [[ "<+pipeline.stages.<+stage.identifier>.spec.execution.steps.terraform_phase.status>" == "FAILED"  ]]; then
                        export failedStepGroup="Terraform"
                      elif [[ "<+pipeline.stages.<+stage.identifier>.spec.execution.steps.migration_phase.status>" == "FAILED"  ]]; then
                        export failedStepGroup="Migration"
                      elif [[ "<+pipeline.stages.<+stage.identifier>.spec.execution.steps.k8s_deployment_phase.steps.canary_phase_group_0.status>" == "FAILED"  ]]; then
                        export failedStepGroup="Canary-Deployment"
                      elif [[ "<+pipeline.stages.<+stage.identifier>.spec.execution.steps.k8s_deployment_phase.steps.rollout_phase_0.status>" == "FAILED"  ]]; then
                        export failedStepGroup="Rollout-Deployment"
                      elif [[ "<+pipeline.stages.<+stage.identifier>.spec.execution.steps.dds_schema_upload_phase.status>" == "FAILED"  ]]; then
                        export failedStepGroup="DDS-Schema-Upload"
                      elif [[ "<+pipeline.stages.<+stage.identifier>.spec.execution.steps.rollout_verify_phase.status>" == "FAILED"  ]]; then
                        export failedStepGroup="Verification"
                      elif [[ "<+pipeline.stages.<+stage.identifier>.spec.execution.steps.wrap_up.status>" == "FAILED"  ]]; then
                        export failedStepGroup="WrapUp"
                      else
                        export failedStepGroup="OtherFailure"
                      fi
                environmentVariables: []
                outputVariables:
                  - name: failedStepGroup
                    type: String
                    value: failedStepGroup
              timeout: 10m
          - step:
              name: Notification for Stage Failure
              identifier: notification_for_stage_failure
              template:
                templateRef: account.notification_template
                versionLabel: "2"
                gitBranch: master
                templateInputs:
                  type: ShellScript
                  spec:
                    environmentVariables:
                      - name: notification_context
                        type: String
                        value: Notification for Pipeline Failure
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 3
                            retryIntervals:
                              - 1m
                            onRetryFailure:
                              action:
                                type: MarkAsSuccess
                  when:
                    stageStatus: All
          - stepGroup:
              identifier: rollback_rollout_deploy
              name: Rollback DDS
              steps:
                - step:
                    name: Checkout Rollback Artifact
                    identifier: checkout_rollback_artifact
                    template:
                      templateRef: account.checkout_rollback_artifact
                      versionLabel: "2"
                      gitBranch: master
                      templateInputs:
                        type: ShellScript
                        spec:
                          delegateSelectors:
                            - <+execution.steps.dds_schema_upload_phase.steps.select_delegate_upload.output.outputVariables.HOST_SELECTOR>
                        failureStrategies: []
                        when:
                          condition: "true"
                          stageStatus: All
                - step:
                    name: Merge Schema V2
                    identifier: merge_schema_v2
                    template:
                      templateRef: account.merge_schema
                      versionLabel: "1"
                      gitBranch: master
                      templateInputs:
                        type: ShellScript
                        spec:
                          delegateSelectors:
                            - <+execution.steps.dds_schema_upload_phase.steps.select_delegate_upload.output.outputVariables.HOST_SELECTOR>
                        failureStrategies: []
                        when:
                          condition: "true"
                          stageStatus: All
                - step:
                    name: Graphql Inspector
                    identifier: graphql_inspector
                    template:
                      templateRef: account.graphql_inspector
                      versionLabel: "1"
                      gitBranch: master
                      templateInputs:
                        type: ShellScript
                        spec:
                          delegateSelectors:
                            - <+execution.steps.dds_schema_upload_phase.steps.select_delegate_upload.output.outputVariables.HOST_SELECTOR>
                        failureStrategies: []
                        when:
                          condition: "true"
                          stageStatus: All
                - step:
                    type: HarnessApproval
                    identifier: dds_rollback_approval
                    name: Breaking Upload pproval
                    when:
                      stageStatus: Success
                      condition: "!(0 == 0 || 0 == 0)"
                    timeout: 1800s
                    spec:
                      includePipelineExecutionHistory: true
                      approvers:
                        userGroups: <+input>
                        minimumCount: 1
                        disallowPipelineExecutor: false
                      approvalMessage: |-
                        Schema is not backward compatible. It can easily be live issue if not checked with care.
                        Please check with scrutiny in logs of Previous Step(Graphql Inspector), that rollback changes are okay to go ahead.
                        Only admin can approve these changes, please ask team lead or EM for the same.
                      isAutoRejectEnabled: false
                      approverInputs: []
                - step:
                    name: Schema Federation Check
                    identifier: schema_federation_check
                    template:
                      templateRef: account.schema_federation_check
                      versionLabel: "1"
                      gitBranch: master
                      templateInputs:
                        type: ShellScript
                        spec:
                          delegateSelectors:
                            - <+execution.steps.dds_schema_upload_phase.steps.select_delegate_upload.output.outputVariables.HOST_SELECTOR>
                        failureStrategies: []
                        when:
                          condition: "true"
                          stageStatus: All
                - step:
                    identifier: schema_upload
                    name: Schema Upload
                    template:
                      templateRef: account.schema_upload
                      templateInputs:
                        type: ShellScript
                        spec:
                          delegateSelectors:
                            - <+execution.steps.dds_schema_upload_phase.steps.select_delegate_upload.output.outputVariables.HOST_SELECTOR>
                        failureStrategies: []
                        when:
                          condition: "true"
                          stageStatus: All
                - step:
                    identifier: cleanup
                    name: CleanUp
                    template:
                      templateRef: account.cleanup
                      templateInputs:
                        type: ShellScript
                        spec:
                          environmentVariables:
                            - name: destination
                              type: String
                              value: <+variable.service_workspace_path>/dds
                          delegateSelectors:
                            - <+execution.steps.dds_schema_upload_phase.steps.select_delegate_upload.output.outputVariables.HOST_SELECTOR>
                        when:
                          condition: ((<+serviceVariableOverrides.EndgameTags> == null || <+serviceVariableOverrides.EndgameTags> == 'null') && (<+serviceVariableOverrides.EndgameE2ETags> == null || <+serviceVariableOverrides.EndgameE2ETags> == 'null')) || (<+stage.variables.SkipCanary> == "True")
                          stageStatus: All
              when:
                stageStatus: All
                condition: <+pipeline.stages.<+stage.identifier>.spec.execution.steps.dds_schema_upload_phase.steps.schema_upload.output.outputVariables.isschema_uploaded> == "True" && <+serviceVariableOverrides.DDSVaultPath> != null && <+serviceVariableOverrides.DDSVaultPath> != "null"
          - stepGroup:
              name: Rollback K8s Deploy
              identifier: rollback_k8s_deploy_phase
              steps:
                - stepGroup:
                    name: Rollabck Rollout
                    identifier: rollabck_rollout_phase
                    steps:
                      - step:
                          type: K8sRollingRollback
                          identifier: rollback_deployment_step
                          name: Rollback Deployment
                          timeout: 1440m
                          spec:
                            pruningEnabled: <+<+serviceVariableOverrides.EnableExcessiveResourcePruning>==null?false:<+serviceVariableOverrides.EnableExcessiveResourcePruning.equalsIgnoreCase('true')>>
                    strategy:
                      matrix:
                        overrideManifest: <+(<+serviceVariableOverrides.OverrideManifestFilePath>!=null && <+serviceVariableOverrides.OverrideManifestFilePath>!='null')?(<+<+serviceVariableOverrides.EnableSingularCanary>=='True'?[<+serviceVariableOverrides.OverrideManifestFilePath>]:<+serviceVariableOverrides.OverrideManifestFilePath.split(',')>>):['_null_']>
                    variables:
                      - name: OverrideManifestFilePath
                        type: String
                        value: <+matrix.overrideManifest>
                        description: ""
                        required: false
                      - name: ReleaseIdentifier
                        type: String
                        value: <+stepGroup.identifierPostFix.replaceAll('_','-')>
                        description: ""
                        required: false
                - stepGroup:
                    name: Canary Rollback
                    identifier: rollback_canary_phase_group
                    steps:
                      - stepGroup:
                          name: Scale Down Canary
                          identifier: scale_down_canary
                          steps:
                            - step:
                                name: Canary Routes Scale Down
                                identifier: canary_routes_scale_down
                                template:
                                  templateRef: account.canary_routes_config
                                  versionLabel: "4"
                                  templateInputs:
                                    type: ShellScript
                                    spec:
                                      environmentVariables:
                                        - name: Weight
                                          type: String
                                          value: <+serviceVariableOverrides.CanaryPercentage.split(',')[<+size(<+serviceVariableOverrides.CanaryPercentage.split(',')>)>-<+strategy.iteration>-2]>
                                        - name: CanaryWorkload
                                          type: String
                                          value: <+pipeline.stages.<+stage.identifier>.spec.execution.steps.k8s_deployment_phase.steps.canary_phase_group<+strategy.node.rollback_canary_phase_group.identifierPostFix>.steps.canary_deploy_step.output.canaryWorkload>
                                    when:
                                      stageStatus: All
                                    failureStrategies:
                                      - onFailure:
                                          errors:
                                            - Connectivity
                                            - DelegateProvisioning
                                            - DelegateRestart
                                          action:
                                            type: Retry
                                            spec:
                                              retryCount: 3
                                              retryIntervals:
                                                - 1m
                                              onRetryFailure:
                                                action:
                                                  type: ManualIntervention
                                                  spec:
                                                    timeout: 10m
                                                    onTimeout:
                                                      action:
                                                        type: MarkAsFailure
                                      - onFailure:
                                          errors:
                                            - AllErrors
                                          action:
                                            type: MarkAsFailure
                            - step:
                                type: Wait
                                name: Canary Cooldown
                                identifier: canary_cooldown
                                spec:
                                  duration: <+(<+serviceVariableOverrides.CanaryVerificationTime>=='' || <+serviceVariableOverrides.CanaryScaleDownWaitDuration>==null || <+serviceVariableOverrides.CanaryScaleDownWaitDuration>=='null')?'10m':<+serviceVariableOverrides.CanaryScaleDownWaitDuration>>
                                when:
                                  stageStatus: All
                          strategy:
                            repeat:
                              times: <+size(<+serviceVariableOverrides.CanaryPercentage.split(',')>)-1>
                              maxConcurrency: 1
                            when: <+serviceVariableOverrides.EnableControlledCanary>=="True"
                          when:
                            stageStatus: All
                            condition: <+pipeline.stages.<+stage.identifier>.spec.execution.steps.k8s_deployment_phase.steps.canary_phase_group<+strategy.node.rollback_canary_phase_group.identifierPostFix>.steps.scale_canary_step_group_<+<+<+size(<+serviceVariableOverrides.CanaryPercentage.split(',')>)-2>-<+strategy.iteration>>.toString()>.steps.canary_routes_config.status> == "SUCCEEDED" && <+pipeline.stages.<+stage.identifier>.spec.execution.steps.k8s_deployment_phase.steps.canary_phase_group<+strategy.node.rollback_canary_phase_group.identifierPostFix>.steps.decrease_canary_traffic_<+strategy.iteration.toString()>.steps.scale_down.status> != "SUCCEEDED"
                      - step:
                          name: Canay Routes Scale Down
                          identifier: canay_rollback_routes_scale_down
                          template:
                            templateRef: account.canary_routes_config
                            versionLabel: "4"
                            templateInputs:
                              type: ShellScript
                              spec:
                                environmentVariables:
                                  - name: Weight
                                    type: String
                                    value: "0"
                                  - name: CanaryWorkload
                                    type: String
                                    value: <+pipeline.stages.<+stage.identifier>.spec.execution.steps.k8s_deployment_phase.steps.canary_phase_group<+stepGroup.identifierPostFix>.steps.canary_deploy_step.output.canaryWorkload>
                              when:
                                condition: <+serviceVariableOverrides.EnableControlledCanary>=="True"
                                stageStatus: All
                              failureStrategies: []
                      - step:
                          type: K8sCanaryDelete
                          name: CanaryDelete Rollback
                          identifier: CanaryDelete_Rollback
                          spec: {}
                          timeout: 10m
                        isContainerStepGroup: false
                      - step:
                          name: Canary Service Deletion
                          identifier: canary_service_deletion
                          template:
                            templateRef: account.canary_service_deletion
                            versionLabel: "4"
                            templateInputs:
                              type: ShellScript
                              spec:
                                environmentVariables:
                                  - name: CanaryWorkload
                                    type: String
                                    value: <+pipeline.stages.<+stage.identifier>.spec.execution.steps.k8s_deployment_phase.steps.canary_phase_group<+stepGroup.identifierPostFix>.steps.canary_deploy_step.output.canaryWorkload>
                              when:
                                condition: "true"
                                stageStatus: All
                              failureStrategies: []
                        isContainerStepGroup: false
                    strategy:
                      matrix:
                        overrideManifest: <+(<+serviceVariableOverrides.OverrideManifestFilePath>!=null && <+serviceVariableOverrides.OverrideManifestFilePath>!='null')?(<+<+serviceVariableOverrides.EnableSingularCanary>=='True'?[<+serviceVariableOverrides.OverrideManifestFilePath>]:<+serviceVariableOverrides.OverrideManifestFilePath.split(',')>>):['_null_']>
                    variables:
                      - name: ReleaseIdentifier
                        type: String
                        value: <+stepGroup.identifierPostFix.replaceAll('_','-')>
                        description: ""
                        required: false
                      - name: OverrideManifestFilePath
                        type: String
                        value: <+matrix.overrideManifest>
                        description: ""
                        required: false
                    when:
                      stageStatus: All
                      condition: <+pipeline.stages.<+stage.identifier>.spec.execution.steps.k8s_deployment_phase.steps.canary_phase_group<+stepGroup.identifierPostFix>.status> == "FAILED" || <+pipeline.stages.<+stage.identifier>.spec.execution.steps.k8s_deployment_phase.steps.canary_phase_group<+stepGroup.identifierPostFix>.status> == "APPROVAL_REJECTED" || <+pipeline.stages.<+stage.identifier>.spec.execution.steps.k8s_deployment_phase.steps.canary_phase_group<+stepGroup.identifierPostFix>.status> == "EXPIRED"
          - stepGroup:
              identifier: rollback_migration_phase
              name: Rollback Migration
              steps:
                - step:
                    name: Run Rollback Migration Script
                    identifier: run_rollback_migration_script
                    template:
                      templateRef: account.run_rollback_migration_script
                      versionLabel: "1"
                      gitBranch: master
                      templateInputs:
                        type: ShellScript
                        failureStrategies: []
                        when:
                          condition: <+serviceVariableOverrides.RollbackMigrationScriptFilePath> != null && <+serviceVariableOverrides.RollbackMigrationScriptFilePath> != "null"
          - step:
              identifier: cleanup
              name: CleanUp
              template:
                templateRef: account.cleanup
                versionLabel: "1"
                templateInputs:
                  type: ShellScript
                  spec:
                    environmentVariables:
                      - name: destination
                        type: String
                        value: <+variable.service_workspace_path>
                    delegateSelectors:
                      - <+execution.steps.dds_schema_upload_phase.steps.select_delegate_upload.output.outputVariables.HOST_SELECTOR>
                  when:
                    condition: "false"
                    stageStatus: All
          - step:
              type: JiraUpdate
              identifier: jira
              name: Jira
              when:
                stageStatus: Success
                condition: <+env.type> == "Production"
              failureStrategies:
                - onFailure:
                    errors:
                      - AllErrors
                    action:
                      type: Ignore
              timeout: 10m
              spec:
                connectorRef: account.hotstar_jira
                issueKey: <+pipeline.stages.release_approval.spec.execution.steps.approval.steps.jira.issue.key>
                transitionTo:
                  transitionName: ""
                  status: Archived
                fields: []
      service:
        serviceRef: <+input>
        serviceInputs: <+input>
    failureStrategies:
      - onFailure:
          errors:
            - DelegateProvisioning
            - DelegateRestart
            - Connectivity
          action:
            type: Retry
            spec:
              retryCount: 3
              retryIntervals:
                - 1m
              onRetryFailure:
                action:
                  type: StageRollback
      - onFailure:
          errors:
            - AllErrors
          action:
            type: StageRollback
    variables:
      - name: CommitId
        type: String
        value: <+artifact.tag.split('-')[2]>
      - name: SkipCanary
        type: String
        default: "False"
        value: <+input>.allowedValues(True,False)
    when:
      pipelineStatus: Success
      condition: <+input>
    strategy: <+input>
  identifier: multi_phase_deploy
  tags: {}
  versionLabel: "36"
