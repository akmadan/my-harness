                          when:
                            stageStatus: Success
                            condition: <+serviceVariableOverrides.EnableManualApprovalForMultiFleetRollout>=='True' && <+serviceVariables.OverrideManifestFilePath>!=null && <+serviceVariables.OverrideManifestFilePath>!='null' && (<+size(<+serviceVariables.OverrideManifestFilePath.split(',')>)> gt 1)
                          failureStrategies:
                            - onFailure:
                                errors:
                                  - DelegateProvisioning
                                  - DelegateRestart
                                  - Connectivity
                                action:
                                  type: Retry
                                  spec:
                                    retryCount: 3
                                    retryIntervals:
                                      - 1m
