# Global values
global:
  namespace: ns-akshit-pipeline-app-1

# Node.js Server Configuration
nodeServer:
  replicaCount: 2
  image:
    repository: akshitmadanharness/pipeline-project-1-node-server
    tag: v2
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  env:
    NODE_ENV: production

# React Frontend Configuration
reactFrontend:
  replicaCount: 2
  image:
    repository: akshitmadanharness/pipeline-project-1-react-frontend
    tag: v2
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 80
  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "64Mi"
      cpu: "50m"
