apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    app: react-frontend
spec:
  replicas: {{ .Values.reactFrontend.replicaCount }}
  selector:
    matchLabels:
      app: react-frontend
  template:
    metadata:
      labels:
        app: react-frontend
    spec:
      containers:
      - name: react-frontend
        image: "{{ .Values.reactFrontend.image.repository }}:{{ .Values.reactFrontend.image.tag }}"
        imagePullPolicy: {{ .Values.reactFrontend.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.reactFrontend.service.port }}
        resources:
          {{- toYaml .Values.reactFrontend.resources | nindent 12 }}
