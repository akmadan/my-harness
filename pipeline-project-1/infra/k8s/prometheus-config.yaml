apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: akshit-pipeline-app-1
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      # - "first_rules.yml"
      # - "second_rules.yml"
    
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      
      - job_name: 'node-server'
        static_configs:
          - targets: ['node-server-service:9090']
        metrics_path: '/metrics'
        scrape_interval: 10s
