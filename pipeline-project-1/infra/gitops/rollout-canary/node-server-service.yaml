apiVersion: v1
kind: Service
metadata:
  name: node-server-service
  namespace: ns-akshit-pipeline-app-1
spec:
  selector:
    app: node-server
  ports:
    - protocol: TCP
      port: 3000
      targetPort: http
      name: http
    - protocol: TCP
      port: 9090
      targetPort: metrics
      name: metrics
  type: ClusterIP
