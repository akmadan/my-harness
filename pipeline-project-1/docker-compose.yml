version: '3.8'

services:
  node-server:
    build:
      context: ./node-server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - app-network
    restart: unless-stopped

  react-frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - node-server
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
